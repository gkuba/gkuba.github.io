<div class="pal" id="palette" hidden data-index="{{ (site.Home.OutputFormats.Get "json").RelPermalink }}">
  <div class="pal-box" role="dialog" aria-modal="true" aria-label="Search the site">
    <input class="pal-in" type="search" placeholder="Search projects, posts and pages, full text…" autocomplete="off" spellcheck="false">
    <ul class="pal-list" role="listbox"></ul>
    <p class="pal-hint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p>
  </div>
</div>
