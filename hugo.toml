baseURL = "https://tuxgamer.com/"
locale = "en-us"
title = "GKuba"
enableGitInfo = true
enableRobotsTXT = true

[params]
  spotlight = "ProgressCrabs"
  author = "GKuba"
  description = "Linux setup scripts, small tools and game mods by GKuba."
  github = "https://github.com/gkuba"
  now = "Mostly Linux setup scripts, small tools and game mods. Latest: ProgressCrabs 0.6 is out, and ReelAnvil is in the works."
  nexus = "https://www.nexusmods.com/users/3362321?tab=user+files"

[outputs]
  home = ["html", "rss", "json"]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    style = "dracula"
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = false

[menus]
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 1
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 2
  [[menus.main]]
    name = "Setup"
    pageRef = "/setup"
    weight = 3
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 4
